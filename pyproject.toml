[project]
name = "square-appointments-mcp"
version = "1.1.0"
description = "Connect Square Appointments to ChatGPT, Claude, Codex and Claude Code through Cotlet.dev, a hosted MCP server. No Square Appointments API key needed."
readme = "README.md"
license = "Elastic-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Cotlet.dev", email = "contact@cotlet.dev" }]
keywords = ["square-appointments", "square-appointments api", "square-appointments mcp", "mcp server", "claude", "chatgpt", "ai agent", "cotlet"]
classifiers = ["Programming Language :: Python :: 3", "Topic :: Office/Business"]
dependencies = []

[project.urls]
Homepage = "https://cotlet.dev/integrations/square-appointments-api-mcp-server?utm_source=pypi&utm_medium=package&utm_campaign=square-appointments"
Source = "https://github.com/cotlet-connect/square-appointments-mcp"

[project.scripts]
square-appointments-mcp = "square_appointments_agent:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel.force-include]
"square_appointments_agent.py" = "square_appointments_agent.py"

[tool.hatch.build.targets.sdist]
include = ["square_appointments_agent.py", "README.md", "LICENSE", "mcp.json", "Dockerfile", "glama.json", "skills", "examples", ".cursor"]
